---
name: DotNet-Build-And-Test

on:
  workflow_call:
    inputs:
      repo-branch:
        description: "Repository Branch"
        type: string
        required: true
      platform:
        description: "The steps will run only on the platform specified"
        type: string
        default: "All"
      skip-pack:
        description: "Do not execute dotnet pack"
        type: boolean
        default: false
      job-timeout-minutes:
        description: "Overall timeout (minutes) for the build-and-test job"
        type: number
        default: 45
      test-timeout-minutes:
        description: "Timeout (minutes) for the DotNet Build And Test step"
        type: number
        default: 30
      publish-container:
        description: "Publish container images for the projects that declare a ContainerRepository"
        type: boolean
        default: false
      publish-container-latest:
        description: "Also point `latest` at the published image. A release decision: only the official pipeline of a repository should set it, because `latest` is what an unqualified pull and a default deployment resolve to"
        type: boolean
        default: false
      fail-fast:
        description: "Cancel the other operating system's job as soon as one fails. Off, both jobs run to the end, so an intermittent failure on one system does not hide the result of the other and a rerun is not needed to learn it"
        type: boolean
        default: true
      failure-artifact-paths:
        description: "Paths (one per line, relative to the workspace, the repository being cloned into ./Repo) uploaded as an artifact when the job fails - test results, captures, traces. Nothing is uploaded on success"
        type: string
        default: "Repo/_WorkFlowResults"
      failure-artifact-retention-days:
        description: "Days the failure artifact is kept"
        type: number
        default: 7
      install-quicktype:
        description: "Install the quicktype npm package in the test job. Only a repository whose code or tests run quicktype needs it, so it is off unless asked for — today only Sts.Lib asks"
        type: boolean
        default: false
    secrets:
      RepositoryToken:
        required: true
      RegistryToken:
        required: true
      ContainerRegistryUser:
        required: false
      ContainerRegistryToken:
        required: false

defaults:
  run:
    shell: pwsh

permissions:
  contents: write
  packages: write

# Two kinds of run, never mixed on one machine:
# - a pull request, a manual dispatch or a schedule builds and tests;
# - a push to master/main publishes, on fresh runners where no test has run.
# The code a push publishes was tested by the pull request that brought it, on the tree the merge produced,
# so the push does not test it a third time. Publishing apart also keeps whatever a test run writes into
# the checkout out of a package or an image: a fresh checkout is a known state, which `dotnet clean` alone
# is not, since it removes only what MSBuild built.
jobs:
  build-and-test:
    if: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Clone
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        uses: STS-SW/SharedWorkflows/.github/actions/clone@master
        with:
          repo-branch: ${{inputs.repo-branch}}
          clone-devops: "false"
          is_debug: false
          token: ${{ secrets.RepositoryToken }}

      - name: Setup
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        uses: STS-SW/SharedWorkflows/.github/actions/setup@master
        with:
          environment: dotnet
          install-quicktype: ${{ inputs.install-quicktype }}

      - name: Log Cloned Branches
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        run: |
          Write-Host "************** Repo Data **************"
          Write-Host "repo-branch  : ${{ inputs.repo-branch }} (ignored on pull_request)"
          Write-Host "event        : ${{ github.event_name }} ${{ github.ref }}"
          Write-Host "Repo   commit: $(git -C ./Repo    rev-parse HEAD)"
          Write-Host "platform     : ${{ inputs.platform }}"
          Write-Host "skip-pack    : ${{ inputs.skip-pack }}"
          Write-Host "Repo   branch: $(git -C ./Repo    rev-parse --abbrev-ref HEAD)"

      # The CI engine is sts-tools (a published .NET global tool), not the legacy DevOps
      # PowerShell engine. Install it from the GitHub Packages feed before the build steps.
      #
      # The source name is load-bearing: NuGet indexes credentials by SOURCE NAME, and the
      # sections are merged across the whole config chain. Naming it exactly as the repositories
      # name it in their own nuget.config - `Sts.Software` - lets these credentials serve the
      # source those files declare, so a repository never has to commit a token of its own.
      # `<clear />` in a repository's <packageSources> clears sources, NOT credentials.
      - name: Install sts-tools
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/StsSoftware/index.json" `
            --name Sts.Software --username ci --password "${{ secrets.RegistryToken }}" --store-password-in-clear-text
          dotnet tool install --global sts-tools

      # Repos consuming the Sts.Sdk / Sts.Test.Sdk MSBuild project SDKs pin exact versions in
      # global.json (msbuild-sdks does not support floating versions). CI always builds against the
      # latest published SDKs by rewriting the pins in the runner workspace (never committed).
      # No-op for repos without a global.json / msbuild-sdks section.
      - name: Pin Latest STS SDKs
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        run: sts-tools devops pinSdk --folder ./Repo --registryToken "${{ secrets.RegistryToken }}"

      # runFolderWorkflow spelled out, plus a configuration. The runner starts from a fresh checkout, so a
      # per-project clean protects nothing - and it deletes the outputs of the referenced projects too, which
      # with --force made every project recompile its whole reference graph. Without both, MSBuild compiles a
      # shared library once and every later project reuses it. What a platform tests is the repository's
      # choice, declared per project in a <project>.csproj.<platform>.workflow sidecar (TestArguments).
      - name: DotNet Build And Test
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        run: |
          $config = Join-Path $env:RUNNER_TEMP "build-once.workflow.json"
          '{ "BuildClean": false, "BuildForce": false }' | Set-Content -Path $config -Encoding utf8
          sts-tools devops runWorkflow --folder ./Repo --filter "*.csproj" --tasks DotNetBuildAndTest --postWorkflowTask PostDotNetWorkFlow --goToGitRoot --onErrorContinue --isWorkflow --config $config

      # What a failed run leaves behind dies with the runner unless it is uploaded: the test results,
      # and whatever the tests themselves wrote to explain a failure. Without it an intermittent
      # failure can only be read from the log, and a rerun that passes erases the only evidence.
      # The attempt is part of the name because a rerun of the failed jobs belongs to the same run.
      - name: Upload Failure Artifacts
        if: ${{ failure() && (inputs.platform == 'All' || inputs.platform==runner.os) }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: ${{ inputs.failure-artifact-paths }}
          retention-days: ${{ inputs.failure-artifact-retention-days }}
          if-no-files-found: ignore

  # The code index of a framework repository, refreshed on the release pull request (staging -> master/main)
  # once its build and tests are green: Build -> Test -> Reindex -> Push -> Merge. The index is committed on
  # staging, the head of that pull request, so the rebase merge carries it to master/main like any other
  # commit, and the post-release realignment brings it back to staging. A repository without a committed
  # .sts-framework-repo is not indexed. The commit is made only when the content of the index changed -
  # `sts-tools index build` compares fingerprints - and carries [skip ci]: it changes no code, and the
  # tests of the code it describes have just passed. RepositoryToken pushes it: the identity behind that
  # secret must be allowed to push to staging.
  code-index:
    needs: build-and-test
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'staging' && (github.base_ref == 'master' || github.base_ref == 'main') }}
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    steps:
      # The branch itself, not the pull request's merge ref: the commit goes on top of staging.
      - name: Checkout Staging
        uses: actions/checkout@v6
        with:
          ref: staging
          path: "./Repo"
          fetch-depth: 1
          token: ${{ secrets.RepositoryToken }}

      - name: Detect Framework Repository
        id: marker
        run: |
          $isFramework = Test-Path "./Repo/.sts-framework-repo"
          "framework=$($isFramework.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Framework repository: $isFramework"

      - name: Setup
        if: ${{ steps.marker.outputs.framework == 'true' }}
        uses: STS-SW/SharedWorkflows/.github/actions/setup@master
        with:
          environment: dotnet
          install-quicktype: "false"

      - name: Install sts-tools
        if: ${{ steps.marker.outputs.framework == 'true' }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/StsSoftware/index.json" `
            --name Sts.Software --username ci --password "${{ secrets.RegistryToken }}" --store-password-in-clear-text
          dotnet tool install --global sts-tools

      - name: Pin Latest STS SDKs
        if: ${{ steps.marker.outputs.framework == 'true' }}
        run: sts-tools devops pinSdk --folder ./Repo --registryToken "${{ secrets.RegistryToken }}"

      # The checkout folder is always ./Repo, so the name written on every document of the index comes
      # from the calling repository (a reusable workflow sees its caller's github context).
      - name: Reindex
        if: ${{ steps.marker.outputs.framework == 'true' }}
        run: sts-tools index build --repository ./Repo --name "${{ github.event.repository.name }}" --properties "IsWorkflow=true"

      # Only the index folder is staged: the SDK pins rewritten above belong to the runner, never to the
      # repository.
      - name: Push Index
        if: ${{ steps.marker.outputs.framework == 'true' }}
        working-directory: ./Repo
        run: |
          git add -- .sts-index
          if (-not (git diff --cached --name-only)) {
            Write-Host "Index unchanged: nothing to commit."
            exit 0
          }
          git config user.name "sts-code-index"
          git config user.email "sts-code-index@users.noreply.github.com"
          git commit -m "🗂️ chore(index): refresh the code index [skip ci]"
          git push origin HEAD:staging

  # Packages, on Windows as before, on a runner of its own. The checkout is the pushed commit itself
  # (github.sha), not the branch tip at checkout time: a rerun after the branch moved on publishes what was
  # pushed, not whatever came after it. DotNetPack cleans each project before packing.
  pack:
    if: ${{ !inputs.skip-pack && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    steps:
      - name: Clone
        uses: STS-SW/SharedWorkflows/.github/actions/clone@master
        with:
          repo-branch: ${{ github.sha }}
          clone-devops: "false"
          is_debug: false
          token: ${{ secrets.RepositoryToken }}

      - name: Setup
        uses: STS-SW/SharedWorkflows/.github/actions/setup@master
        with:
          environment: dotnet
          install-quicktype: "false"

      - name: Install sts-tools
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/StsSoftware/index.json" `
            --name Sts.Software --username ci --password "${{ secrets.RegistryToken }}" --store-password-in-clear-text
          dotnet tool install --global sts-tools

      - name: Pin Latest STS SDKs
        run: sts-tools devops pinSdk --folder ./Repo --registryToken "${{ secrets.RegistryToken }}"

      - name: DotNet Pack
        run: sts-tools devops runWorkflow --folder ./Repo --filter "*.csproj" --tasks DotNetPack --isWorkflow --registryToken "${{ secrets.RegistryToken }}" --repositoryToken "${{ secrets.RepositoryToken }}"

  # Linux, because the image this produces is what a container platform runs - the mirror of the pack job
  # running on Windows. A project that declares no ContainerRepository is skipped by the task itself, so
  # pointing this at *.csproj is safe for every repository. DotNetPublishContainer cleans the project before
  # publishing.
  #
  # The image is tagged with the project's version, and a version already in the registry is not
  # republished - so a merge that forgot to bump the version publishes nothing rather than
  # replacing a released image. `latest` moves only when the caller asked for it.
  publish-container:
    if: ${{ inputs.publish-container && (inputs.platform == 'All' || inputs.platform == 'Linux') && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    steps:
      - name: Clone
        uses: STS-SW/SharedWorkflows/.github/actions/clone@master
        with:
          repo-branch: ${{ github.sha }}
          clone-devops: "false"
          is_debug: false
          token: ${{ secrets.RepositoryToken }}

      - name: Setup
        uses: STS-SW/SharedWorkflows/.github/actions/setup@master
        with:
          environment: dotnet
          install-quicktype: "false"

      - name: Install sts-tools
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/StsSoftware/index.json" `
            --name Sts.Software --username ci --password "${{ secrets.RegistryToken }}" --store-password-in-clear-text
          dotnet tool install --global sts-tools

      - name: Pin Latest STS SDKs
        run: sts-tools devops pinSdk --folder ./Repo --registryToken "${{ secrets.RegistryToken }}"

      - name: DotNet Publish Container
        run: sts-tools devops runWorkflow --folder ./Repo --filter "*.csproj" --tasks DotNetPublishContainer --isWorkflow --goToGitRoot ${{ inputs.publish-container-latest && '--containerPublishLatest' || '' }} --registryToken "${{ secrets.RegistryToken }}" --repositoryToken "${{ secrets.RepositoryToken }}" --containerRegistryUser "${{ secrets.ContainerRegistryUser }}" --containerRegistryToken "${{ secrets.ContainerRegistryToken }}"
