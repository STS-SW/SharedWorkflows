---
name: DotNet-Build-And-Test

on:
  workflow_call:
    inputs:
      repo-branch:
        description: "Repository Branch"
        type: string
        required: true
      platform:
        description: "The steps will run only on the platform specified"
        type: string
        default: "All"
      skip-pack:
        description: "Do not execute dotnet pack"
        type: boolean
        default: false
      job-timeout-minutes:
        description: "Overall timeout (minutes) for the build-and-test job"
        type: number
        default: 45
      test-timeout-minutes:
        description: "Timeout (minutes) for the DotNet Build And Test step"
        type: number
        default: 30
      publish-container:
        description: "Publish container images for the projects that declare a ContainerRepository"
        type: boolean
        default: false
      publish-container-latest:
        description: "Also point `latest` at the published image. A release decision: only the official pipeline of a repository should set it, because `latest` is what an unqualified pull and a default deployment resolve to"
        type: boolean
        default: false
      fail-fast:
        description: "Cancel the other operating system's job as soon as one fails. Off, both jobs run to the end, so an intermittent failure on one system does not hide the result of the other and a rerun is not needed to learn it"
        type: boolean
        default: true
      failure-artifact-paths:
        description: "Paths (one per line, relative to the workspace, the repository being cloned into ./Repo) uploaded as an artifact when the job fails - test results, captures, traces. Nothing is uploaded on success"
        type: string
        default: "Repo/_WorkFlowResults"
      failure-artifact-retention-days:
        description: "Days the failure artifact is kept"
        type: number
        default: 7
      install-quicktype:
        description: "Install the quicktype npm package in the test job. Only a repository whose code or tests run quicktype needs it, so it is off unless asked for — today only Sts.Lib asks"
        type: boolean
        default: false
      release-from-staging:
        description: "The repository releases staging into master/main by fast-forward: a pull request into master/main must come from staging, and the `release` label on the release pull request pushes its tested head to master/main. Off for the repositories that keep their own branching model"
        type: boolean
        default: false
    secrets:
      RepositoryToken:
        required: true
      RegistryToken:
        required: true
      ContainerRegistryUser:
        required: false
      ContainerRegistryToken:
        required: false
      # The pushes the pipeline makes to staging (the code index) and to master/main (the release). A personal
      # access token, because a push made with GITHUB_TOKEN starts no workflow, and the push to master/main has
      # to start the one that publishes.
      ReleaseToken:
        required: false

defaults:
  run:
    shell: pwsh

permissions:
  contents: write
  packages: write
  pull-requests: write
  checks: read

# Three kinds of run, never mixed on one machine:
# - a pull request, a manual dispatch or a schedule builds and tests;
# - a push to staging refreshes the code index of a framework repository, and nothing else;
# - a push to master/main publishes, on fresh runners where no test has run.
# The code a push publishes was tested by the pull request that brought it: the release pushes to master/main
# exactly the head the release pull request tested, so the push does not test it again. Publishing apart also
# keeps whatever a test run writes into the checkout out of a package or an image: a fresh checkout is a known
# state, which `dotnet clean` alone is not, since it removes only what MSBuild built.
jobs:
  # Not on a push to staging (the code index runs there), not on a push to master/main (publishing runs there),
  # and not when a label is added: a label changes no code.
  build-and-test:
    if: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')) && github.event.action != 'labeled' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Clone
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        uses: STS-SW/SharedWorkflows/.github/actions/clone@master
        with:
          repo-branch: ${{inputs.repo-branch}}
          clone-devops: "false"
          is_debug: false
          token: ${{ secrets.RepositoryToken }}

      - name: Setup
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        uses: STS-SW/SharedWorkflows/.github/actions/setup@master
        with:
          environment: dotnet
          install-quicktype: ${{ inputs.install-quicktype }}

      - name: Log Cloned Branches
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        run: |
          Write-Host "************** Repo Data **************"
          Write-Host "repo-branch  : ${{ inputs.repo-branch }} (ignored on pull_request)"
          Write-Host "event        : ${{ github.event_name }} ${{ github.ref }}"
          Write-Host "Repo   commit: $(git -C ./Repo    rev-parse HEAD)"
          Write-Host "platform     : ${{ inputs.platform }}"
          Write-Host "skip-pack    : ${{ inputs.skip-pack }}"
          Write-Host "Repo   branch: $(git -C ./Repo    rev-parse --abbrev-ref HEAD)"

      # The CI engine is sts-tools (a published .NET global tool), not the legacy DevOps
      # PowerShell engine. Install it from the GitHub Packages feed before the build steps.
      #
      # The source name is load-bearing: NuGet indexes credentials by SOURCE NAME, and the
      # sections are merged across the whole config chain. Naming it exactly as the repositories
      # name it in their own nuget.config - `Sts.Software` - lets these credentials serve the
      # source those files declare, so a repository never has to commit a token of its own.
      # `<clear />` in a repository's <packageSources> clears sources, NOT credentials.
      - name: Install sts-tools
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/StsSoftware/index.json" `
            --name Sts.Software --username ci --password "${{ secrets.RegistryToken }}" --store-password-in-clear-text
          dotnet tool install --global sts-tools

      # Repos consuming the Sts.Sdk / Sts.Test.Sdk MSBuild project SDKs pin exact versions in
      # global.json (msbuild-sdks does not support floating versions). CI always builds against the
      # latest published SDKs by rewriting the pins in the runner workspace (never committed).
      # No-op for repos without a global.json / msbuild-sdks section.
      - name: Pin Latest STS SDKs
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        run: sts-tools devops pinSdk --folder ./Repo --registryToken "${{ secrets.RegistryToken }}"

      # runFolderWorkflow spelled out, plus a configuration. The runner starts from a fresh checkout, so a
      # per-project clean protects nothing - and it deletes the outputs of the referenced projects too, which
      # with --force made every project recompile its whole reference graph. Without both, MSBuild compiles a
      # shared library once and every later project reuses it. What a platform tests is the repository's
      # choice, declared per project in a <project>.csproj.<platform>.workflow sidecar (TestArguments).
      - name: DotNet Build And Test
        if: ${{  inputs.platform == 'All' || inputs.platform==runner.os }}
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        run: |
          $config = Join-Path $env:RUNNER_TEMP "build-once.workflow.json"
          '{ "BuildClean": false, "BuildForce": false }' | Set-Content -Path $config -Encoding utf8
          sts-tools devops runWorkflow --folder ./Repo --filter "*.csproj" --tasks DotNetBuildAndTest --postWorkflowTask PostDotNetWorkFlow --goToGitRoot --onErrorContinue --isWorkflow --config $config

      # What a failed run leaves behind dies with the runner unless it is uploaded: the test results,
      # and whatever the tests themselves wrote to explain a failure. Without it an intermittent
      # failure can only be read from the log, and a rerun that passes erases the only evidence.
      # The attempt is part of the name because a rerun of the failed jobs belongs to the same run.
      - name: Upload Failure Artifacts
        if: ${{ failure() && (inputs.platform == 'All' || inputs.platform==runner.os) }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: ${{ inputs.failure-artifact-paths }}
          retention-days: ${{ inputs.failure-artifact-retention-days }}
          if-no-files-found: ignore

  # The code index of a framework repository, refreshed on every push to staging - the squash merge of a
  # pull request. It indexes and commits, and tests nothing: the pull request that brought the code tested it.
  # The index commit goes on top of staging with a plain push and no skip directive, so that when a release
  # fast-forwards master/main onto it, the push to master/main still starts the run that publishes. The run
  # that commit starts is skipped here by its author - evaluated without starting a runner - which is what
  # keeps the job from indexing its own commit. When staging moves while the job runs, the push is rejected
  # as a non-fast-forward and the job gives way: the newer push has started a run of its own, and the
  # concurrency group cancels this one or lets it finish without effect. A repository without a committed
  # .sts-framework-repo is not indexed; the commit is made only when the content of the index changed.
  code-index:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && github.event.head_commit.author.name != 'sts-code-index' }}
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    concurrency:
      group: code-index-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Require The Release Token
        env:
          RELEASE_TOKEN: ${{ secrets.ReleaseToken }}
        run: |
          if (-not $env:RELEASE_TOKEN) {
            Write-Error "The ReleaseToken secret is not passed: the index commit cannot be pushed to staging."
            exit 1
          }

      # The pushed commit itself: the index describes it, and the index commit goes on top of it.
      - name: Checkout The Pushed Commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: "./Repo"
          fetch-depth: 1
          token: ${{ secrets.ReleaseToken }}

      - name: Detect Framework Repository
        id: marker
        run: |
          $isFramework = Test-Path "./Repo/.sts-framework-repo"
          "framework=$($isFramework.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Framework repository: $isFramework"

      - name: Setup
        if: ${{ steps.marker.outputs.framework == 'true' }}
        uses: STS-SW/SharedWorkflows/.github/actions/setup@master
        with:
          environment: dotnet
          install-quicktype: "false"

      - name: Install sts-tools
        if: ${{ steps.marker.outputs.framework == 'true' }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/StsSoftware/index.json" `
            --name Sts.Software --username ci --password "${{ secrets.RegistryToken }}" --store-password-in-clear-text
          dotnet tool install --global sts-tools

      - name: Pin Latest STS SDKs
        if: ${{ steps.marker.outputs.framework == 'true' }}
        run: sts-tools devops pinSdk --folder ./Repo --registryToken "${{ secrets.RegistryToken }}"

      # The checkout folder is always ./Repo, so the name written on every document of the index comes from
      # the calling repository (a reusable workflow sees its caller's github context).
      - name: Reindex
        if: ${{ steps.marker.outputs.framework == 'true' }}
        run: sts-tools index build --repository ./Repo --name "${{ github.event.repository.name }}" --properties "IsWorkflow=true"

      # Only the index folder is staged: the SDK pins rewritten above belong to the runner, never to the
      # repository. The author name is what the job's condition recognises: change both or neither.
      - name: Push Index
        if: ${{ steps.marker.outputs.framework == 'true' }}
        working-directory: ./Repo
        run: |
          git add -- .sts-index
          if (-not (git diff --cached --name-only)) {
            Write-Host "Index unchanged: nothing to commit."
            exit 0
          }
          git config user.name "sts-code-index"
          git config user.email "sts-code-index@users.noreply.github.com"
          git commit -m "🗂️ chore(index): refresh the code index"
          $output = git push origin HEAD:refs/heads/staging 2>&1 | Out-String
          $pushed = $LASTEXITCODE
          Write-Host $output
          if ($pushed -ne 0) {
            if ($output -match 'rejected|non-fast-forward|fetch first') {
              Write-Host "::notice::staging moved while the index was built: the run of the newer push indexes it."
              exit 0
            }
            exit $pushed
          }

  # A pull request into master/main comes from staging, or it is not a release. Without branch protection
  # (not available on the plan of these repositories) this is a red check, not a block.
  source-branch:
    if: ${{ inputs.release-from-staging && github.event_name == 'pull_request' && (github.base_ref == 'master' || github.base_ref == 'main') && github.head_ref != 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify The Source Branch
        run: |
          Write-Error "A pull request into ${{ github.base_ref }} must come from staging, not from ${{ github.head_ref }}."
          exit 1

  # The release: the `release` label on the pull request staging -> master/main pushes the head that pull
  # request tested onto master/main, as a fast-forward. The same commits land on both branches, so nothing has
  # to be realigned afterwards, and the push starts the run that publishes. A merge button cannot do this:
  # each of GitHub's merge methods writes new commits. The label is removed whatever the outcome, so that
  # putting it back is how a release is retried.
  release:
    if: ${{ inputs.release-from-staging && github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'release' && github.head_ref == 'staging' && (github.base_ref == 'master' || github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_BRANCH: ${{ github.base_ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require The Release Token
        env:
          RELEASE_TOKEN: ${{ secrets.ReleaseToken }}
        run: |
          if (-not $env:RELEASE_TOKEN) {
            Write-Error "The ReleaseToken secret is not passed: the release cannot push to $env:BASE_BRANCH."
            exit 1
          }

      # The build-and-test checks of the head commit, the latest attempt of each: the run the label itself
      # started reports them as skipped, and a rerun leaves the earlier attempts behind.
      - name: Verify The Tests Of The Head
        run: |
          $runs = gh api --paginate "repos/${{ github.repository }}/commits/$env:HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[] | @json' |
                  ForEach-Object { $_ | ConvertFrom-Json } |
                  Where-Object { $_.name -like '*build-and-test*' -and $_.conclusion -ne 'skipped' }
          $latest = $runs | Group-Object name | ForEach-Object { $_.Group | Sort-Object { [datetime]$_.started_at } | Select-Object -Last 1 }
          if (-not $latest) {
            Write-Error "No build-and-test check found for $env:HEAD_SHA: wait for the tests, then put the label back."
            exit 1
          }
          $latest | ForEach-Object { Write-Host "$($_.name): $($_.status) / $($_.conclusion)" }
          $notGreen = $latest | Where-Object { $_.status -ne 'completed' -or $_.conclusion -ne 'success' }
          if ($notGreen) {
            Write-Error "The tests of $env:HEAD_SHA are not all green: fix or wait, then put the label back."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.ReleaseToken }}

      # A plain push: git itself refuses anything that is not a fast-forward, and nothing here can force it.
      - name: Fast-Forward
        run: |
          git fetch origin $env:BASE_BRANCH
          git merge-base --is-ancestor "origin/$env:BASE_BRANCH" $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) {
            Write-Error "$env:BASE_BRANCH has commits that $env:HEAD_SHA does not contain: it cannot be fast-forwarded."
            exit 1
          }
          git push origin "$($env:HEAD_SHA):refs/heads/$env:BASE_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }
          Write-Host "$env:BASE_BRANCH fast-forwarded to $env:HEAD_SHA."

      - name: Remove The Label
        if: ${{ always() }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label release

  # Packages, on Windows as before, on a runner of its own. The checkout is the pushed commit itself
  # (github.sha), not the branch tip at checkout time: a rerun after the branch moved on publishes what was
  # pushed, not whatever came after it. DotNetPack cleans each project before packing.
  pack:
    if: ${{ !inputs.skip-pack && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    steps:
      - name: Clone
        uses: STS-SW/SharedWorkflows/.github/actions/clone@master
        with:
          repo-branch: ${{ github.sha }}
          clone-devops: "false"
          is_debug: false
          token: ${{ secrets.RepositoryToken }}

      - name: Setup
        uses: STS-SW/SharedWorkflows/.github/actions/setup@master
        with:
          environment: dotnet
          install-quicktype: "false"

      - name: Install sts-tools
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/StsSoftware/index.json" `
            --name Sts.Software --username ci --password "${{ secrets.RegistryToken }}" --store-password-in-clear-text
          dotnet tool install --global sts-tools

      - name: Pin Latest STS SDKs
        run: sts-tools devops pinSdk --folder ./Repo --registryToken "${{ secrets.RegistryToken }}"

      - name: DotNet Pack
        run: sts-tools devops runWorkflow --folder ./Repo --filter "*.csproj" --tasks DotNetPack --isWorkflow --registryToken "${{ secrets.RegistryToken }}" --repositoryToken "${{ secrets.RepositoryToken }}"

  # Linux, because the image this produces is what a container platform runs - the mirror of the pack job
  # running on Windows. A project that declares no ContainerRepository is skipped by the task itself, so
  # pointing this at *.csproj is safe for every repository. DotNetPublishContainer cleans the project before
  # publishing.
  #
  # The image is tagged with the project's version, and a version already in the registry is not
  # republished - so a merge that forgot to bump the version publishes nothing rather than
  # replacing a released image. `latest` moves only when the caller asked for it.
  publish-container:
    if: ${{ inputs.publish-container && (inputs.platform == 'All' || inputs.platform == 'Linux') && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    steps:
      - name: Clone
        uses: STS-SW/SharedWorkflows/.github/actions/clone@master
        with:
          repo-branch: ${{ github.sha }}
          clone-devops: "false"
          is_debug: false
          token: ${{ secrets.RepositoryToken }}

      - name: Setup
        uses: STS-SW/SharedWorkflows/.github/actions/setup@master
        with:
          environment: dotnet
          install-quicktype: "false"

      - name: Install sts-tools
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/StsSoftware/index.json" `
            --name Sts.Software --username ci --password "${{ secrets.RegistryToken }}" --store-password-in-clear-text
          dotnet tool install --global sts-tools

      - name: Pin Latest STS SDKs
        run: sts-tools devops pinSdk --folder ./Repo --registryToken "${{ secrets.RegistryToken }}"

      - name: DotNet Publish Container
        run: sts-tools devops runWorkflow --folder ./Repo --filter "*.csproj" --tasks DotNetPublishContainer --isWorkflow --goToGitRoot ${{ inputs.publish-container-latest && '--containerPublishLatest' || '' }} --registryToken "${{ secrets.RegistryToken }}" --repositoryToken "${{ secrets.RepositoryToken }}" --containerRegistryUser "${{ secrets.ContainerRegistryUser }}" --containerRegistryToken "${{ secrets.ContainerRegistryToken }}"
