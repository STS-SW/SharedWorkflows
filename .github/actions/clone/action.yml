# https://docs.github.com/en/actions/tutorials/create-actions/create-a-composite-action?platform=linux

---
name: Clone-Action
description: "Clone DevOps and target repositories for build workflows"

inputs:
  repo-branch:
    description: "Repository Branch"
    required: true
  devops-branch:
    description: "DevOps repository branch"
    default: "master"
    required: false
  clone-devops:
    description: "Clone the legacy DevOps repository (its PowerShell engine is superseded by sts-tools)"
    default: "true"
    required: false
  is_debug:
    description: "Run in debug mode"
    default: "false"
  token:
    description: "GitHub token for accessing repositories"
    required: true

runs:
  using: "composite"
  steps:
    - name: Clone DevOps
      if: ${{ inputs.clone-devops == 'true' }}
      uses: actions/checkout@v6
      with:
        repository: "StsSoftware/DevOps"
        ref: ${{ inputs.devops-branch }}
        path: "./DevOps"
        token: ${{ inputs.token }}
        fetch-depth: 1

    # On a pull request the ref is left empty, so actions/checkout takes the pull request's own merge ref
    # (refs/pull/<n>/merge): the change under review, merged onto its base. The callers pass
    # `github.event.ref` as repo-branch, which is empty on a pull_request event and falls back to the
    # default branch, so every pull request used to build and test master/main instead of its own code.
    - name: Clone Repo
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name != 'pull_request' && inputs.repo-branch || '' }}
        path: "./Repo"
        fetch-depth: 1

    - name: Print current directory
      if: ${{ inputs.is_debug == 'true' }}
      shell: pwsh
      run: Get-Location

    - name: Print current directory content
      if: ${{ inputs.is_debug == 'true' }}
      shell: pwsh
      run: |
        function Show-FolderTree {
            param (
                [string]$Path = (Get-Location),
                [int]$Level = 0
            )

            Get-ChildItem -Path $Path -Directory | ForEach-Object {
                $folder = $_
                $indent = ' ' * $Level
                $fileCount = (Get-ChildItem -Path $folder.FullName -File | Measure-Object).Count

                Write-Output ("$indent- $($folder.Name) [$fileCount files]")

                Get-ChildItem -Path $folder.FullName -File | ForEach-Object {
                    Write-Output ("$indent  $($_.Name)")
                }

                Show-FolderTree -Path $folder.FullName -Level ($Level + 2)
            }
        }

        Show-FolderTree -Path .
