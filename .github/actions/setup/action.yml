---
name: Setup-Action
description: "Setup development environment for different project types (dotnet, react, etc.)"

inputs:
  environment:
    description: "Run environment (dotnet, react, ecc...)"
    required: true
  install-quicktype:
    description: "Install the quicktype npm package globally. Only a repository whose code or tests run quicktype needs it, and it costs about a minute on Windows"
    default: "true"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      if: ${{ inputs.environment == 'dotnet' }}
      uses: actions/setup-node@v6
      with:
        node-version: "current"
        check-latest: true

    # - name: Install Playwright
    #   if: ${{ inputs.environment == 'dotnet' }}
    #   shell: pwsh
    #   run: npx playwright install

    - name: Install QuickType
      if: ${{ inputs.environment == 'dotnet' && inputs.install-quicktype == 'true' }}
      shell: pwsh
      run: npm install -g quicktype

    - name: Setup .NET 10.0
      # if: ${{ inputs.environment == 'dotnet' && runner.os == 'Linux' }}
      if: ${{ inputs.environment == 'dotnet' }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.x
